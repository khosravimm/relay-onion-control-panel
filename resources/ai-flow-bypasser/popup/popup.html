<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'none'; object-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'none';">
<title>AI Flow Bypasser</title>
<link rel="stylesheet" href="popup.css">
</head>
<body data-tone="wait">

<div class="aurora" aria-hidden="true">
  <span class="blob blob-signal"></span>
  <span class="blob blob-violet"></span>
  <span class="blob blob-blue"></span>
</div>

<div class="stack">

  <header class="masthead">
    <img class="masthead-mark" src="../icons/icon-48.png" alt="" width="36" height="36">
    <div class="masthead-names">
      <h1 class="masthead-name" dir="ltr">AI Flow Bypasser</h1>
      <p class="masthead-sub">حل مشکل دسترسی گوگل فلو</p>
    </div>
  </header>

  <main class="gate glass">
    <span class="gate-signal" aria-hidden="true"></span>

    <div class="gate-head">
      <p id="headline" class="gate-state">در حال بررسی</p>
      <button id="switch" class="switch" type="button" role="switch" aria-checked="false"
              aria-label="فعال‌سازی دسترسی" disabled>
        <span class="switch-thumb"></span>
      </button>
    </div>

    <p id="detail" class="gate-detail" role="status">وضعیت افزونه خوانده می‌شود…</p>
  </main>

  <button id="open" class="action glass" type="button">بازکردن Flow</button>

  <p id="error" class="error" role="alert" hidden></p>

  <p class="footnote">با هر بار تغییر این کلید، تب‌های باز Flow خودشان دوباره بارگذاری می‌شوند.</p>

  <footer class="social">

      <span>کانال تلگرام</span>
